<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code Scanner & Generator | Huokaing Thara Banking System</title>
    <link rel="stylesheet" href="qr_scanner.css">
    <link rel="icon" href="bank.jpg" type="image/jpeg">
    <link rel="icon" href="bank.jpg">
</head>
<body>

    <!-- Bank Logo Wrapper & Branding -->
    <div class="bank-logo-wrapper">
        <img src="bank.jpg" alt="Bank Logo" class="bank-logo-img">
    </div>

    <!-- Inline QR Scanner Security Logo Component -->
    <div class="qr-logo-container">
        <svg class="qr-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" width="160" height="160" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
            <g fill="#38bdf8">
                <rect x="40" y="40" width="40" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="8"/>
                <rect x="52" y="52" width="16" height="16" fill="#38bdf8"/>
                <rect x="120" y="40" width="40" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="8"/>
                <rect x="132" y="52" width="16" height="16" fill="#38bdf8"/>
                <rect x="40" y="120" width="40" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="8"/>
                <rect x="52" y="132" width="16" height="16" fill="#38bdf8"/>
            </g>
            <rect x="120" y="120" width="16" height="16" fill="#ef4444"/>
            <rect x="144" y="120" width="16" height="16" fill="#38bdf8"/>
            <rect x="120" y="144" width="16" height="16" fill="#38bdf8"/>
            <rect x="144" y="144" width="16" height="16" fill="#ef4444"/>
            <circle cx="100" cy="100" r="30" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
            <circle cx="100" cy="100" r="6" fill="#ef4444"/>
        </svg>
        <div class="logo-caption">Secure QR Matrix Node</div>
    </div>

    <!-- Main Scanner Functional Container -->
    <div class="scanner-container">
        <h2>QR Code Scanner & Generator</h2>
        <p class="subtitle">Scan via camera, upload file, or generate a custom transfer QR code.</p>

        <!-- Camera Viewport Box -->
        <div class="viewport-box">
            <video id="cameraPreview" autoplay playsinline></video>
            <div class="scanner-laser"></div>
        </div>

        <!-- Controls: Flash & Switch -->
        <div class="control-row">
            <button id="toggleFlashBtn" class="btn-secondary" disabled>🔦 Toggle Flash</button>
            <button id="switchCameraBtn" class="btn-secondary">🔄 Switch Camera</button>
        </div>

        <div class="divider"><span>OR GENERATE QR</span></div>

        <!-- QR Generator Section with Stacked Layout -->
        <div class="qr-generator-inline-section">
            <label for="qrAmountInput">Set Transfer Amount (USD)</label>
            <input type="number" id="qrAmountInput" placeholder="e.g. 50.00">
            <button id="generateQRBtn" class="btn-secondary">Generate QR Code</button>
            <div id="generatedQRResult"></div>
        </div>

        <div class="divider"><span>OR UPLOAD</span></div>

        <!-- Upload QR Code Section -->
        <div class="upload-section">
            <label for="qrUploadInput" class="upload-label">📁 Upload QR Image File</label>
            <input type="file" id="qrUploadInput" accept="image/*" style="display: none;">
        </div>

        <div id="scannerResult" class="message-box"></div>

        <div class="action-footer">
            <a href="https://tharahuokaing.github.io/bank2/" class="btn-link">Return to Dashboard</a>
        </div>
    </div>

    <!-- Script Architecture -->
    <script src="qr_scanner.js"></script>
    <script src="qr_upload.js"></script>
    <script src="qr_withdrawal.js"></script>
    <script src="qr_generator.js"></script>
    <script src="qr-receipt.js"></script>
    <script src="ultra_secure_mode.js"></script>
    
</body>
</html>
